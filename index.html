<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ControlPyme - Subir documento</title>
<style>
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#F4F6F8;color:#14202B}
  .wrap{max-width:440px;margin:0 auto;padding:24px 18px}
  h1{font-size:20px;margin:0 0 4px}
  p.sub{margin:0 0 20px;color:#5B6B7A;font-size:14px}
  .card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  label.btn{display:block;text-align:center;background:#0F766E;color:#fff;padding:16px;border-radius:12px;font-weight:600;font-size:16px;cursor:pointer}
  input[type=file]{display:none}
  .row{margin-top:14px;font-size:14px}
  select{width:100%;padding:10px;border-radius:10px;border:1px solid #D5DCE3;font-size:15px;background:#fff}
  #estado{margin-top:16px;font-size:15px;line-height:1.4}
  .ok{color:#0F766E}.err{color:#B42318}
  img#prev{max-width:100%;border-radius:10px;margin-top:14px;display:none}
  pre{white-space:pre-wrap;word-break:break-word;background:#F4F6F8;border-radius:10px;padding:10px;font-size:12px;max-height:260px;overflow:auto}
</style>
</head>
<body>
<div class="wrap">
  <h1>Subir documento</h1>
  <p class="sub">Foto o PDF de una factura de proveedor (prueba: Arvores)</p>
  <div class="card">
    <label class="btn" for="archivo">📷 Tomar foto o elegir archivo</label>
    <input id="archivo" type="file" accept="image/*,application/pdf">
    <div class="row">
      <select id="tipo">
        <option value="A_factura_proveedor">Factura de proveedor (compra)</option>
      </select>
    </div>
    <img id="prev" alt="">
    <div id="estado"></div>
  </div>
</div>
<script>
const WEBHOOK = "https://hook.us2.make.com/wy8qhkzlknnug8862fo7ngqgri9tvs47";
const EMPRESA = "arvores";
const $ = id => document.getElementById(id);

function aBase64(blob){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(",")[1]);
    r.onerror = rej;
    r.readAsDataURL(blob);
  });
}

// Reduce fotos grandes (máx 1600 px) para que suban rápido
function reducirImagen(file){
  return new Promise((res, rej) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 1600;
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k);
      c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => { URL.revokeObjectURL(url); b ? res(b) : rej(new Error("No se pudo leer la imagen")); }, "image/jpeg", 0.85);
    };
    img.onerror = () => rej(new Error("No se pudo abrir la imagen"));
    img.src = url;
  });
}

$("archivo").addEventListener("change", async e => {
  const f = e.target.files[0];
  if(!f) return;
  const est = $("estado");
  est.className = ""; est.textContent = "Preparando archivo...";
  try{
    let blob = f, mime = f.type;
    if(mime.startsWith("image/")){
      blob = await reducirImagen(f); mime = "image/jpeg";
      $("prev").src = URL.createObjectURL(blob); $("prev").style.display = "block";
    } else {
      $("prev").style.display = "none";
    }
    const data = await aBase64(blob);
    est.textContent = "Enviando y leyendo el documento... (puede tardar unos segundos)";
    const resp = await fetch(WEBHOOK, {
      method: "POST",
      mode: "no-cors",
      headers: {"Content-Type": "text/plain"},
      body: JSON.stringify({
        empresa_id: EMPRESA,
        origen: "pagina_web",
        tipo_documento: $("tipo").value,
        mime_type: mime,
        nombre_archivo: f.name,
        archivo_base64: data
      })
    });
    est.className = "ok";
    est.textContent = "✅ Enviado. El sistema está leyendo el documento.";
  }catch(err){
    est.className = "err";
    est.textContent = "❌ No se pudo enviar: " + err.message;
  }
  e.target.value = "";
});
</script>
</body>
</html>
